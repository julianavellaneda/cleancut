# Tool configuration for the backend. Config only, by design.
#
# There is deliberately no `[project]` table and no `[build-system]` table, and
# adding either is the change to reject. `conftest.py` lives at this directory
# root, which is what puts the directory on `sys.path`, which is what lets tests
# `import app.*` by exactly the path `uvicorn app.main:app` uses. Turning this
# into an installed package would route imports through site-packages instead
# and the tests would stop exercising the layout the application actually runs
# in - silently, while still passing. `tests/test_dependency_locks.py` fails if
# either table appears here.
#
# The tools themselves are pinned in requirements-dev.in / requirements-dev.txt,
# not here, so they stay inside the lock, the hash enforcement, CI's drift check
# and Dependabot's /backend pip entry.

[tool.ruff]
# 3.10 is the floor the locks compile at and the version the README promises,
# even though CI and the image both run 3.12. Saying 3.12 here would let 3.11+
# syntax merge and quietly break the Python the docs commit to.
target-version = "py310"

# The code was hand-wrapped to 79/80 (p95 is exactly 80). 88 is ruff's default
# and was chosen from a measurement, not a preference: `ruff format --diff` at
# 79 / 88 / 100 produced 3634 / 2398 / 1675 added lines, and 88 is where the
# reflow is mostly splitting genuinely over-long lines rather than joining pairs
# the authors wrapped on purpose. See the sweep commit for the numbers.
line-length = 88

# backend/ is the import root - the same one conftest.py establishes by sitting
# here. Without it, isort classifies `app` as a third-party package that happens
# to share the name and reorders every file's imports into a shape that
# contradicts how they actually resolve.
src = ["."]

[tool.ruff.lint]
# Explicit `select`, never `extend-select`. Ruff 0.16 changed its default rule
# set from 59 rules to 413; a repo that inherits the default has a lint gate
# that means something different after every bump. Listing the families makes
# the ruleset a decision that lives in version control.
#
#   E, W  pycodestyle       F   pyflakes
#   I     import sorting    UP  pyupgrade
#   B     bugbear
select = ["E", "W", "F", "I", "UP", "B"]

# E501 is line-too-long, and it is off because the formatter owns width now.
# `ruff format` is best-effort: it will not split a long string literal or a URL,
# so leaving E501 on means the two tools disagree about files neither can fix.
# Astral's own guidance is to disable it whenever the formatter is in use.
ignore = ["E501"]

# No per-file-ignores, and none should be added. The frontend's eslint config
# carries no ignore list either, and that is the precedent: a blanket per-file
# ignore is how a lint gate becomes decoration. A rule that is wrong about one
# line gets a `# noqa: XXX` on that line with a reason next to it.

[tool.ruff.lint.isort]
# `app` is this repo, not a PyPI package that happens to share the name.
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# B008 forbids a function call in a default argument, and it is wrong about
# every FastAPI route in this codebase - 28 of them. `prompt: str = Form(None)`
# is not a mutable-default bug; it is the only way to declare a multipart field.
# A bare default makes FastAPI read the field as a *query* parameter, so the
# upload form's value silently never arrives and the job runs with prompt=None
# as though nobody had typed one. That failure is documented in AGENTS.md
# ("Multipart fields are declared Form(...), never as bare defaults").
#
# Listing them here rather than scattering 28 `# noqa: B008` matters: a noqa on
# each line reads as 28 acknowledged smells, the next person to tidy one up
# reintroduces the bug, and every new route has to remember to add one. This
# says the rule does not apply, once.
#
# Note what is deliberately NOT exempted: `ExportRequest()` as a default in
# app/routes/audio.py is a genuine instance of what B008 is about - one Pydantic
# object built at import time and shared by every request - and it is fixed
# rather than allowed. The allowlist is for FastAPI's parameter API, not for
# anything that merely looks like it.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

# Deliberately NOT selected: the FAST (FastAPI) ruleset. FAST002 wants every
# dependency rewritten as `Annotated[...]`, which is a large refactor of
# app/routes/ dressed up as a lint finding. If that migration is ever wanted it
# should be its own commit with its own reasoning, not a side effect of turning
# a linter on.

[tool.ruff.format]
# Ruff's defaults (double quotes, magic trailing comma respected). Named here so
# a future `ruff format` version change is visible as a config edit rather than
# arriving silently in a dependency bump.
quote-style = "double"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
# Moved here from pytest.ini, which was deleted. The two cannot coexist: pytest
# reads pytest.ini and ignores [tool.pytest.ini_options] entirely when both are
# present, so coverage settings added here while that file survived would have
# been a no-op that looked exactly like a working gate.
#
# conftest.py at the backend root is what puts this directory on sys.path, so
# tests import `app.*` the same way `uvicorn app.main:app` does. That is a
# layout decision, not an accident - see the header of this file.
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.mypy]
# `files` here rather than paths in ci.yml, so a bare `mypy` checks exactly what
# CI checks. A path on the command line would be a second declaration of the
# scope, and the first package added to only one of the two would be checked in
# neither place while the build stayed green.
files = ["app/analysis"]

# Why only `app/analysis` today, and what it will take to widen it.
#
# The intended scope was app/services/ as well. Pointed at the whole package,
# mypy reports 195 errors - and 122 of them are one root cause with nothing to
# do with the code being checked. models.py declares columns the SQLAlchemy 1.x
# way (`status = Column(String)`) rather than the 2.0 way
# (`status: Mapped[str] = mapped_column(String)`), so the inferred attribute
# type is `Column[str]` and every ordinary `job.status = "completed"` reads as
# assigning a str to a Column. That fires wherever the ORM is touched, which is
# most of services/ and routes/, so it is not something the strict block below
# can be scoped around.
#
# Migrating models.py is the real fix and it is deliberately not bundled in
# here: it is a runtime change to the data layer, and it belongs in a commit
# whose subject says so and whose tests are about that. Until then, a scope
# where mypy runs clean is worth more than a wider one that is 122 errors deep
# and therefore permanently switched off.
#
# app/analysis/ is the honest half of the original intent: it is where a wrong
# type is a silently wrong *answer* rather than a 500, it is the LLM boundary
# where everything arrives as untyped JSON, and it barely touches the ORM.
#
# tests/ is out of scope on its own terms - 9,898 lines of fixtures and
# monkeypatching, a larger job than the application. ruff covers tests/.

# 3.12, and NOT the 3.10 the locks compile at - which is the opposite of the
# choice ruff's target-version makes two screens up, so it needs a reason.
#
# `python_version` decides which *installed* stubs mypy will accept, not just
# which syntax. The lock resolves numpy 2.2.6 below 3.11 and 2.4.6 above it, and
# 2.4.6's stubs use PEP 695 `type` statements, which mypy rejects outright when
# told to target 3.10 - one syntax error in numpy's .pyi and nothing gets
# checked at all. Pinning 3.10 here would mean type-checking a combination that
# exists nowhere: 3.10's rules against the stubs pip only installs on 3.12.
#
# Nothing is lost by this. The 3.10 promise is kept by the thing that can
# actually keep it - `uv pip compile --python-version 3.10`, which fails if a
# dependency has dropped it - and ruff still rewrites syntax against py310.
python_version = "3.12"

warn_redundant_casts = true

# Global-only, and the reason it is on: a typo in one of the module patterns
# below - `app.service.*` for `app.services.*` - would otherwise mean that
# package is silently checked at the lenient baseline forever, with a green
# build throughout. This turns the typo into an error.
warn_unused_configs = true

# The baseline for the rest of app/: routes, models, database, main, eval. Real
# errors are reported - a wrong attribute, a bad argument count - but an
# unannotated function is not yet itself an error. Ratcheting a package up means
# moving its pattern into the strict block below, which is a one-line commit.
disallow_untyped_defs = false
check_untyped_defs = true

# Left off globally on purpose: a genuine typo in an import should still be an
# error, and a blanket ignore is how that quietly stops being true.
ignore_missing_imports = false

# The only two dependencies in scope that ship no `py.typed` and have no stub
# package on PyPI. numpy, sqlalchemy, openai, anthropic and python-dotenv are
# all typed.
[[tool.mypy.overrides]]
module = ["faster_whisper.*"]
ignore_missing_imports = true

# The strict core: the two packages where a type error is a silently wrong
# answer rather than a 500.
#
# `strict = true` cannot be written here. It is a global-only option, and set
# per-module it is ignored *without a warning* - which is precisely the silent
# under-checking this gate exists to prevent - so the flags it implies are
# spelled out instead. This is every flag `mypy --strict` turns on in 2.3 except
# `warn_redundant_casts`, which is global-only and set above.
#
# The cost of enumerating them is that a future mypy adding a flag to --strict
# will not tighten this gate on its own. That is the intended trade: the same
# argument as the lockfile, that a build should not change because a bot bumped
# a version.
[[tool.mypy.overrides]]
module = ["app.analysis.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
implicit_reexport = false
