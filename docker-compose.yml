services:
  backend:
    build: ./backend
    # Published on loopback unless CLEANCUT_HOST says otherwise. The container
    # still binds 0.0.0.0 internally - a container's network is not the host's,
    # so what decides who can reach CleanCut is the interface published here.
    ports:
      - "${CLEANCUT_HOST:-127.0.0.1}:8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend/uploads:/app/uploads
      - ./backend/exports:/app/exports
    env_file: .env
    environment:
      - DATABASE_PATH=/app/data/audio_compliance.db
    restart: unless-stopped

  frontend:
    build: ./frontend
    # The browser calls the frontend's own /api; the Next server proxies it to
    # the backend over the Compose network. That name only resolves in here,
    # which is the point: the browser never needs to know where the backend is,
    # so nothing about it has to be decided at build time.
    environment:
      - BACKEND_ORIGIN=${BACKEND_ORIGIN:-http://backend:8000}
    ports:
      - "${CLEANCUT_HOST:-127.0.0.1}:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
