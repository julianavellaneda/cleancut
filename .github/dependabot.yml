# Weekly dependency PRs. This exists because of the Next.js-with-28-advisories
# incident (0d0343c): the dependencies were pinned and then nothing was watching
# them, which is the failure mode a lockfile creates and an update bot closes.
#
# Everything is grouped per ecosystem, so a quiet week is one PR to review
# rather than nine. Security updates still arrive as their own PRs regardless of
# the grouping - that is Dependabot's behaviour, and it is the one worth
# interrupting for.
#
# Note on pip: backend/ carries a compiled lock, so the entry below is a real
# routine-update source and no longer advisory-only.
#
# The file names are load-bearing and must not be "tidied". Dependabot decides a
# file is a pip-compile lockfile in `pip_compile_file_matcher.rb`: the name must
# end in `.txt`, and either the content matches `--output-file <name>` or a
# sibling `<name>.in` exists. backend/requirements.txt satisfies both, so
# Dependabot re-runs the compile and updates the lock. Naming the lock
# `requirements.lock` instead - the obvious choice, and the one this repo's own
# plan originally specified - matches neither test: Dependabot would fall back
# to reading requirements.txt as plain floors, open PRs bumping numbers nothing
# installs, and never touch the lock. Green automation that changes nothing.
version: 2
updates:
  # `lockfile-only` is what keeps this entry honest, and it is not a
  # preference. requirements.in declares *floors* - the oldest version this
  # application is willing to run against - and requirements.txt is the
  # `--universal` compile of them, which is allowed to carry the same package
  # several times behind environment markers because the floor is Python 3.10
  # and a package that dropped 3.10 still has to resolve for it.
  #
  # Left to `increase`, Dependabot edits the .in to force a bump the floors
  # forbid, and the marker split silently collapses. That is exactly what it
  # did to numpy: 2.5.2 requires Python >=3.12, the lock already carried it on
  # >=3.12 next to 2.4.6 on 3.11 and 2.2.6 below, and the "bump" rewrote
  # `numpy>=1.24.0` to `numpy>=2.5.2` and folded three lines into one. The PR
  # delivered no version the lock did not already have on the interpreters that
  # can run it, and paid for that with 3.10 and 3.11 - the support the README
  # badge promises. Nothing in CI would have caught it: the lock is internally
  # consistent and the job runs on 3.12.
  #
  # With `lockfile-only`, Dependabot may move requirements.txt within the
  # declared floors and may not touch the .in at all. Raising a floor stays a
  # human decision, made when dropping an interpreter is the actual intent.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: lockfile-only
    groups:
      backend:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend:
        patterns: ["*"]

  # The devcontainer's two base images are pinned by digest. A pin nothing
  # moves goes stale quietly; this turns each new digest into a PR.
  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    groups:
      devcontainer:
        patterns: ["*"]

  # The workflows pin actions by major tag (checkout@v4, setup-node@v4), which
  # moves silently. This is what makes a major bump visible as a PR.
  #
  # astral-sh/setup-uv is the exception and must stay a full vX.Y.Z: it stopped
  # publishing major aliases at v8.0.0, so a major-shaped pin there resolves to
  # nothing and takes the whole backend job down before its first step. See the
  # comment on that step in ci.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
