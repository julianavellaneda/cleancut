name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first; nothing here is worth
# paying for twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + types + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # No test shells out to it, but preflight probes for both binaries and the
      # cost of being wrong about that is a red build for a missing system
      # package rather than a real regression.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # Pinned to the version CONTRIBUTING.md's regeneration ritual names. Two
      # uv versions that format the header differently would fail the check
      # below on an otherwise correct commit, so the two must move together.
      #
      # The action is pinned to a full `vX.Y.Z`, and that is not a style choice:
      # setup-uv stopped publishing major and minor tag aliases at v8.0.0, on
      # purpose, so that a compromised release cannot be moved under a pin (the
      # tj-actions attack). `@v10` therefore does not exist and never will --
      # it resolves to nothing and the whole job dies in "Set up job", before
      # ruff, mypy, pytest or the lock-drift check below have run at all. That
      # is a silent hole in the gate rather than a red test, so when bumping
      # this, copy a real release tag; do not shorten it to a major.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.10"

      # Re-compiles both locks and fails on any diff. Without this, a dependency
      # added to a .in without re-compiling installs nothing at all: the build
      # stays green while the lock quietly stops describing the application.
      # Cheapest check in the job, so it runs before the install it guards.
      - name: Check the dependency locks are up to date
        working-directory: backend
        run: |
          uv pip compile requirements.in \
            --universal --python-version 3.10 --generate-hashes \
            --output-file requirements.txt --quiet
          uv pip compile requirements-dev.in \
            --universal --python-version 3.10 --generate-hashes \
            --output-file requirements-dev.txt --quiet
          git diff --exit-code -- requirements.txt requirements-dev.txt \
            || { echo "::error::A lock is stale. Re-run the two commands above and commit the result."; exit 1; }

      # requirements-dev.txt is the compiled lock, not the declaration. Hashes
      # are enforced here for the same reason as in the image: a lock installed
      # without --require-hashes is a lock that can still be lied to.
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.txt

      # Formatting, then linting, then types, then tests: strictly increasing
      # cost, so the cheapest signal is the first to fail. This mirrors the
      # frontend job's lint-then-type-check-then-test order, for the same reason.
      #
      # All three come from requirements-dev.txt, which is why they cannot run before
      # the install - and why neither goes through astral-sh/ruff-action. That
      # action installs a ruff of its own choosing, so CI would enforce one
      # version while `pip install -r requirements-dev.txt` handed a contributor
      # another. A formatter two machines disagree about is worse than none.
      - name: Format check (ruff)
        working-directory: backend
        run: ruff format --check app tests conftest.py

      # --no-fix because CI reports, it does not edit: a finding that happens to
      # be auto-fixable is still a finding. --output-format=github annotates the
      # offending line in the PR diff rather than only in the log.
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check --no-fix --output-format=github app tests conftest.py

      # Scope comes from pyproject.toml's `files`, deliberately not from a path
      # on this line. A path here would be a second declaration of what gets
      # checked, and the first package added to only one of the two would be
      # checked in neither place while the build stayed green. It covers
      # app/analysis/ today and says in that file what it will take to widen it.
      - name: Type-check (mypy)
        working-directory: backend
        run: mypy

      # --cov-config is named explicitly because pytest-cov does not reliably
      # discover coverage settings in a pyproject.toml on its own. The floor
      # lives in that file rather than on this line, so raising it is a commit
      # against the configuration and not against the workflow.
      #
      # The flags are here rather than in addopts so a bare `pytest` on a laptop
      # stays the fast thing it is today: coverage roughly doubles the run and
      # gets in the way of a debugger.
      - name: pytest
        working-directory: backend
        run: pytest --cov=app --cov-config=pyproject.toml --cov-report=term-missing

      # Scorer regression, not accuracy: this grades a recorded run, so what it
      # protects is the matching rules and the labels. It prints the scorecard
      # into the build log, so a run that drifts from 15/16 to 14/16 while still
      # passing is visible rather than merely green.
      - name: Eval scorecard (recorded run - scorer regression)
        working-directory: backend
        run: python -m app.eval.run ../tests/fixtures/demo/seed_job.json

      # This one grades the detectors as they stand on this commit: the level
      # pass runs against the real clip and the scrubber against the committed
      # word-level transcript. No model and no API key, so it can gate every
      # push - the LLM half stays opt-in behind `--live`, which costs money and
      # cannot be deterministic. Floors, not exact numbers: the run scores
      # 1.00 / 0.92 today, the one miss being "Er," - a filler Whisper dropped
      # from the transcript, which a detector reading that transcript cannot
      # recover (see test_eval.py). Those two numbers are also hardcoded into a
      # README badge - no service publishes them - so if this run's score moves,
      # update the badge in the same commit.
      - name: Detector eval (scrubber, deterministic)
        working-directory: backend
        run: >
          python -m app.eval.run
          --detectors ../tests/fixtures/demo/demo_seminar.mp3
          --suite scrub --min-precision 0.95 --min-recall 0.85

  frontend:
    name: Frontend (types + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # AGENTS.md states "eslint runs clean". This is the step that makes that
      # a fact rather than an assertion. It runs before the type-check because
      # it is the cheapest of the three signals, so it should be the first to
      # fail.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      # tsc runs separately from the build: `next build` type-checks the app
      # graph, this catches a type error in a file nothing imports yet - and
      # the test files, which the app graph never reaches.
      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      # jsdom, so no browser to install. What these cover is the logic a type
      # error cannot reach: which rows a bulk sweep moves, and when the undo
      # button is offered.
      - name: Vitest
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
